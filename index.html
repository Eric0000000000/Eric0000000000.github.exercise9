<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Hello World Elements</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Exact CSS Box Styles based on the design specifications */
        .box-1 {
            background-color: #bde0fe; /* Light Blue */
            border: 4px solid #ff6b6b;  /* Coral/Light Red inner border */
            outline: 4px solid #ff6b6b; /* Coral/Light Red outer border */
            outline-offset: 4px;       /* Creates double border effect with gap */
            padding: 8px 16px;
            margin-bottom: 28px;
        }

        .box-2 {
            background-color: #ffff00; /* Yellow */
            border: 2px solid #007aff; /* Blue Solid Border */
            border-radius: 15px;       /* Rounded Corners */
            padding: 8px 16px;
            margin-bottom: 28px;
        }

        .box-3 {
            background-color: #2ea055; /* Medium Green */
            border: 6px dotted #808080; /* Gray Dotted Border */
            padding: 8px 16px;
        }

        .hello-text {
            font-family: 'Times New Roman', Times, serif;
            font-size: 2.25rem;
            font-weight: bold;
            color: #000000;
            line-height: 1.1;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 font-sans">

    <!-- Main Container Card -->
    <div class="bg-white p-6 sm:p-10 rounded-xl shadow-2xl max-w-2xl w-full border border-slate-200">
        
        <!-- Box 1: Double Coral Border on Light Blue Background -->
        <div class="box-1">
            <p class="hello-text">Hello World</p>
        </div>

        <!-- Box 2: Solid Blue Border with Rounded Corners on Yellow Background -->
        <div class="box-2">
            <p class="hello-text">Hello World</p>
        </div>

        <!-- Box 3: Dotted Gray Border on Medium Green Background -->
        <div class="box-3">
            <p class="hello-text">Hello World</p>
        </div>

    </div>

</body>
</html>
